; ESP32 firmware for the DC servo.
;
;   pio run -d firmware                  build
;   pio run -d firmware -t upload        flash (not yet tested on hardware)
;   pio device monitor -d firmware       serial console (921600 baud)
;
; The controller library is shared with the host build: lib_extra_dirs makes
; ../lib/motorctl a PlatformIO library, and firmware/include holds the
; generated controller_params.h that the host tests use as well.

[env:esp32dev]
; Pinned so that CI builds against the same Arduino core (2.0.17, ESP-IDF 4.4)
; as the local build: the PCNT and LEDC calls use the ESP-IDF 4.4 driver API.
platform = platformio/espressif32 @ 7.1.3
board = esp32dev
framework = arduino
lib_extra_dirs = ../lib
monitor_speed = 921600
; warnings for the project sources only (the Arduino core is not warning-clean)
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
