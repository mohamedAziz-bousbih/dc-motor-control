name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python model, design and artefact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest (includes the staleness check of results, README, header, golden vectors)
        run: python -m pytest -v

  c-library:
    name: motorctl C library (gcc, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Limit ASLR entropy for AddressSanitizer
        # ASan's shadow memory layout breaks with the 32-bit mmap randomisation
        # of recent Ubuntu kernels; 28 bits is the value ASan supports.
        if: matrix.variant == 'sanitizers'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DMOTORCTL_WERROR=ON
          -DMOTORCTL_SANITIZE=${{ matrix.variant == 'sanitizers' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: ESP32 firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d firmware
